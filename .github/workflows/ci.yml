name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Type check (client)
        run: npx tsc --noEmit

      - name: Type check (server)
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build
